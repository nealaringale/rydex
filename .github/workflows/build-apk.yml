name: Build RYDEX APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify planner server JavaScript
        run: node --check server/src/index.js

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Required Android build-tools 36.0.0 are missing from the runner."
            exit 1
          fi

      - name: Prepare demo local properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          MAPS_API_KEY=
          RYDEX_BACKEND_URL=http://10.0.2.2:8787/
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rydex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
