name: Build RYDEX APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify planner server JavaScript
        run: node --check server/src/index.js

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"

          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

          test -f "$ANDROID_HOME/platforms/android-37/android.jar"

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            echo "Required Android build-tools 36.0.0 are missing from the runner."
            exit 1
          fi

      - name: Prepare demo local properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          MAPS_API_KEY=${{ secrets.MAPS_API_KEY }}
          RYDEX_BACKEND_URL=${{ secrets.RYDEX_BACKEND_URL || 'http://10.0.2.2:8787/' }}
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rydex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Download debug APK
        uses: actions/download-artifact@v5
        with:
          name: rydex-debug-apk
          path: app/build/outputs/apk/debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch RYDEX on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm clear com.rydex.app >/dev/null 2>&1 || true
            adb shell am force-stop com.rydex.app
            adb logcat -c
            adb shell am start -W -n com.rydex.app/.MainActivity
            sleep 5
            adb logcat -d -v threadtime -t 1200 | tail -n 600
            adb shell dumpsys activity activities > /tmp/rydex-activity.txt
            python3 -c 'import pathlib,sys; s=pathlib.Path("/tmp/rydex-activity.txt").read_text(errors="ignore"); print(s[-6000:]); sys.exit(0 if "com.rydex.app/.MainActivity" in s or "com.rydex.app" in s else 1)'
            adb exec-out screencap -p > /tmp/rydex-screen.png
            test -s /tmp/rydex-screen.png
            python3 -c 'import subprocess,sys; s=subprocess.check_output(["adb","logcat","-d","-v","threadtime","-t","1200"],text=True,errors="ignore"); sys.exit(1 if "FATAL EXCEPTION" in s or ("AndroidRuntime" in s and "com.rydex.app" in s) else 0)'
