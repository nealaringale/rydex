name: Build RYDEX APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi

          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            "$SDKMANAGER" "platforms;android-37"
          fi

          if [ ! -d "$ANDROID_HOME/build-tools/36.0.0" ]; then
            "$SDKMANAGER" "build-tools;36.0.0"
          fi

          if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
            "$SDKMANAGER" "platform-tools"
          fi

          test -d "$ANDROID_HOME/platforms/android-37"

      - name: Prepare demo local properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          MAPS_API_KEY=
          RYDEX_BACKEND_URL=http://10.0.2.2:8787/
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rydex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
